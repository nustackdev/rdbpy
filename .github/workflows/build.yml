name: Build Wheels

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            cibw_archs: "x86_64"

          # Linux aarch64 (ARM)
          - os: ubuntu-latest
            cibw_archs: "aarch64"

          # macOS Intel (x86_64)
          - os: macos-13
            cibw_archs: "x86_64"

          # macOS Apple Silicon (arm64)
          - os: macos-14
            cibw_archs: "arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for aarch64 on Linux)
        if: matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  verify_wheels:
    name: Verify built wheels
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -lh dist/
          echo "Total wheels: $(ls -1 dist/*.whl 2>/dev/null | wc -l)"
          echo "Total sdist: $(ls -1 dist/*.tar.gz 2>/dev/null | wc -l)"

      - name: Verify wheel contents
        run: |
          pip install pkginfo
          python << 'EOF'
          import os
          from pkginfo import Wheel

          wheels = [f for f in os.listdir('dist') if f.endswith('.whl')]
          print(f"\n{'='*60}")
          print(f"Built {len(wheels)} wheels:")
          print(f"{'='*60}")

          for wheel_file in sorted(wheels):
              wheel = Wheel(os.path.join('dist', wheel_file))
              print(f"\n{wheel_file}")
              print(f"  Python: {wheel.supported_platforms}")
              print(f"  Platform: {wheel.supported_platforms}")
          EOF
