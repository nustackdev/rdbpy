name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      RDBPY_DEP_DIR: /tmp/rdbpy_deps
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]  # linux x86_64, mac intel, mac arm
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make cmake

      - name: Cache RocksDB dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: /tmp/rdbpy_deps
          key: rdbpy-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-rocksdb-*.sh', 'scripts/rocksdb-cstdint.patch') }}

      - name: Build RocksDB dependencies (Linux)
        if: runner.os == 'Linux' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          export RDBPY_DEP_DIR=/tmp/rdbpy_deps
          bash scripts/build-rocksdb-linux.sh

      - name: Build RocksDB dependencies (macOS)
        if: runner.os == 'macOS' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          export RDBPY_DEP_DIR=/tmp/rdbpy_deps
          bash scripts/build-rocksdb-macos.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          # Test deps only; the package itself is built in the next step.
          uv pip install --system pytest

      - name: Install rdbpy
        run: |
          export LD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$LD_LIBRARY_PATH
          export DYLD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$DYLD_LIBRARY_PATH
          uv pip install --system -e .

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$LD_LIBRARY_PATH
          export DYLD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$DYLD_LIBRARY_PATH
          pytest tests -v --tb=short

      - name: Run quick integration test
        run: |
          export LD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$LD_LIBRARY_PATH
          export DYLD_LIBRARY_PATH=/tmp/rdbpy_deps/lib:$DYLD_LIBRARY_PATH
          python << 'EOF'
          import rdbpy
          import tempfile
          import os

          with tempfile.TemporaryDirectory() as tmpdir:
              db_path = os.path.join(tmpdir, "test.db")
              opts = rdbpy.Options(create_if_missing=True)
              db = rdbpy.DB(db_path, opts)

              # Test basic operations
              db.put(b"test_key", b"test_value")
              assert db.get(b"test_key") == b"test_value"
              db.delete(b"test_key")
              assert db.get(b"test_key") is None

              db.close()
              print("✓ Integration test passed!")
          EOF

